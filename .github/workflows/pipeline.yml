name: CI/CD test -> prod

# Każda zmiana na main: build i testy -> wdrożenie na TEST -> walidacja i testy bezpieczeństwa na TEST
# -> zatwierdzenie -> wdrożenie na PROD -> testy dymne PROD (tylko odczyt).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Wdróż uszkodzoną wersję na TEST (test rollbacku)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  # ----------------------------------------------------------------- BUILD
  build:
    name: 1. Build + testy jednostkowe + SAST
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.img.outputs.image }}
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt -e .
      - name: Lint
        run: flake8 --max-line-length 120 src tests ../tests
      - name: Testy jednostkowe
        run: pytest -v
      - name: SAST (Bandit)
        run: bandit -r src -ll
      - id: img
        run: echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/lab11-taskapi:1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------- IMAGE
  image:
    name: 2. Obraz (GHCR) + skan Trivy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=1.0.0-${{ github.sha }}
          tags: ${{ needs.build.outputs.image }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Skan obrazu (Trivy) - bramka CRITICAL
        env: {TRIVY_USERNAME: "${{ github.actor }}", TRIVY_PASSWORD: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.57.1 image --severity HIGH,CRITICAL \
            --ignore-unfixed --no-progress "${{ needs.build.outputs.image }}" | tee trivy.txt
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.57.1 image --severity CRITICAL \
            --ignore-unfixed --exit-code 1 --quiet "${{ needs.build.outputs.image }}"

  # ----------------------------------------------------------- DEPLOY TEST
  deploy-test:
    name: 3. Deploy TEST
    needs: [build, image]
    runs-on: [self-hosted, lab11]
    environment: {name: test, url: "http://localhost:30111"}
    concurrency: {group: env-test, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v5
      - name: Wdrożenie (konto deployer namespace test)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}            # sekret środowiska GitHub "test"
          PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure && '1' || '0' }}
        run: bash deploy/deploy.sh test "${{ needs.build.outputs.image }}"

  # ------------------------------------------- WALIDACJA + BEZPIECZEŃSTWO (TEST)
  validate-test:
    name: 4. Walidacja i testy bezpieczeństwa na TEST
    needs: deploy-test
    runs-on: [self-hosted, lab11]
    steps:
      - uses: actions/checkout@v5
      - name: Testy funkcjonalne i separacji środowisk
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q pytest==8.3.3 requests==2.32.3
          BASE_URL=http://localhost:30111 EXPECTED_ENV=test PROD_URL=http://localhost:30211 \
            "$RUNNER_TEMP/venv/bin/pytest" -v tests/env --junitxml=env-test.xml
      - name: DAST - OWASP ZAP na środowisku TEST
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://host.docker.internal:30111/ -r zap-test.html -J zap-test.json -I
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          alerts = json.load(open("zap/zap-test.json"))["site"][0]["alerts"]
          print("### DAST (OWASP ZAP) - środowisko TEST\n\n| Ryzyko | Alert | Liczba |\n| --- | --- | --- |")
          for a in sorted(alerts, key=lambda a: -int(a["riskcode"])):
              print(f'| {a["riskdesc"].split(" (")[0]} | {a["name"]} | {a["count"]} |')
          high = [a for a in alerts if a["riskcode"] == "3"]
          print(f"\nAlerty wysokiego ryzyka: {len(high)} - " + ("BLOKADA wdrożenia na PROD" if high else "można wdrażać na PROD"))
          raise SystemExit(1 if high else 0)
          PY

  # ----------------------------------------------------------- DEPLOY PROD
  deploy-prod:
    name: 5. Deploy PROD (zatwierdzenie)
    needs: [build, validate-test]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: [self-hosted, lab11]
    environment: {name: production, url: "http://localhost:30211"}
    concurrency: {group: env-prod, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v5
      - name: Wdrożenie (konto deployer namespace prod)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}            # sekret środowiska GitHub "production"
          PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: bash deploy/deploy.sh prod "${{ needs.build.outputs.image }}"
      - name: Testy dymne PROD (tylko odczyt)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q pytest==8.3.3 requests==2.32.3
          BASE_URL=http://localhost:30211 EXPECTED_ENV=production "$RUNNER_TEMP/venv/bin/pytest" -v -m readonly tests/env

  # ---------------------------------------------------------- POWIADOMIENIE
  notify:
    name: 6. Powiadomienie
    needs: [build, image, deploy-test, validate-test, deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RESULT: ${{ contains(needs.*.result, 'failure') && 'BŁĄD' || 'SUKCES' }}
      DETAILS: "build=${{ needs.build.result }} image=${{ needs.image.result }} test=${{ needs.deploy-test.result }} walidacja=${{ needs.validate-test.result }} prod=${{ needs.deploy-prod.result }}"
    steps:
      - run: |
          echo "## Pipeline: $RESULT" >> "$GITHUB_STEP_SUMMARY"; echo "\`$DETAILS\`" >> "$GITHUB_STEP_SUMMARY"
      - if: env.RESULT == 'BŁĄD' && github.event_name != 'pull_request'
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "❌ Wdrożenie nieudane @ ${GITHUB_SHA::7}" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Etapy: \`$DETAILS\`"
