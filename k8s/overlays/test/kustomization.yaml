# Środowisko: test
namespace: test
resources: [../../base]
labels:
  - pairs: {environment: test}
configMapGenerator:
  - name: taskapi-config          # zmiana konfiguracji = nowa nazwa = automatyczny restart podów
    envs: [app.env]
  - name: prometheus-config
    files: [prometheus.yml]
patches:
  - target: {kind: Deployment, name: taskapi}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Service, name: taskapi}
    patch: |-
      - {op: replace, path: /spec/ports/0/nodePort, value: 30111}
  - target: {kind: Service, name: prometheus}
    patch: |-
      - {op: replace, path: /spec/ports/0/nodePort, value: 30119}
