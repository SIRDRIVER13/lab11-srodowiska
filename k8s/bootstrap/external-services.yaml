# Zewnętrzna usługa płatności (atrapa) w dwóch wariantach: SANDBOX dla testu i LIVE dla produkcji.
# Sandbox przyjmuje tylko klucze sk_test_, live tylko sk_live_.
apiVersion: v1
kind: ConfigMap
metadata: {name: paymock, namespace: external}
data:
  server.py: |
    import json, os
    from http.server import BaseHTTPRequestHandler, HTTPServer
    MODE = os.environ["MODE"]
    PREFIX = "sk_test_" if MODE == "SANDBOX" else "sk_live_"

    class Handler(BaseHTTPRequestHandler):
        def send(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            self.send(200, {"provider": "PayMock", "mode": MODE, "status": "ok"})

        def do_POST(self):
            body = json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
            if not self.headers.get("X-Api-Key", "").startswith(PREFIX):
                return self.send(401, {"provider": "PayMock", "mode": MODE, "error": "klucz API nie pasuje do trybu " + MODE})
            self.send(200, {"provider": "PayMock", "mode": MODE, "charged": MODE == "LIVE",
                            "amount": body.get("amount"), "caller_env": body.get("env")})

    HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments-sandbox, namespace: external}
spec:
  selector: {matchLabels: {app: payments-sandbox}}
  template:
    metadata: {labels: {app: payments-sandbox}}
    spec:
      containers:
        - name: mock
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          env: [{name: MODE, value: SANDBOX}]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: code, mountPath: /app}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
      volumes: [{name: code, configMap: {name: paymock}}]
---
apiVersion: v1
kind: Service
metadata: {name: payments-sandbox, namespace: external}
spec:
  selector: {app: payments-sandbox}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments-live, namespace: external}
spec:
  selector: {matchLabels: {app: payments-live}}
  template:
    metadata: {labels: {app: payments-live}}
    spec:
      containers:
        - name: mock
          image: python:3.12-slim
          command: ["python", "/app/server.py"]
          env: [{name: MODE, value: LIVE}]
          ports: [{containerPort: 8080}]
          volumeMounts: [{name: code, mountPath: /app}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 64Mi}}
      volumes: [{name: code, configMap: {name: paymock}}]
---
apiVersion: v1
kind: Service
metadata: {name: payments-live, namespace: external}
spec:
  selector: {app: payments-live}
  ports: [{port: 8080, targetPort: 8080}]
