[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskapi"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["flask>=3.0", "gunicorn>=22.0", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "requests>=2.32", "prometheus-client>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
